<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د مکتب معلومات</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:white;
    padding:25px 15px;
    text-align:center;
}

.header h2{
    margin:0 0 8px;
}

.header p{
    margin:0;
    opacity:.9;
}

.container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

.back{
    display:block;
    background:white;
    color:#0d6efd;
    text-decoration:none;
    text-align:center;
    padding:13px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.school-logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#0d6efd;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.school-name{
    text-align:center;
    color:#0d6efd;
    margin:15px 0 5px;
}

.info{
    margin-top:20px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:14px 5px;
    border-bottom:1px solid #eee;
}

.row:last-child{
    border-bottom:none;
}

.label{
    font-weight:bold;
    color:#555;
}

.value{
    color:#0d6efd;
    text-align:left;
}

.description{
    line-height:2;
    color:#555;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    border:0;
    cursor:pointer;
    font-size:15px;
}

.print{
    background:#0d6efd;
    color:white;
}

.phone{
    background:#198754;
    color:white;
}

.loading{
    text-align:center;
    padding:30px;
}

@media print{

    .back,
    .buttons{
        display:none;
    }

    body{
        background:white;
    }

    .card{
        box-shadow:none;
    }
}

</style>

</head>

<body>

<div class="header">

    <h2>🏫 د مکتب معلومات</h2>

    <p>د ښوونځي رسمي معلومات</p>

</div>


<div class="container">

    <a href="dashboard.html" class="back">
        ⬅️ Dashboard ته بېرته
    </a>


    <div id="content">

        <div class="loading">
            ⏳ معلومات لوډ کېږي...
        </div>

    </div>

</div>


<script>

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function loadSchoolInfo(){

    let settings =
        JSON.parse(
            localStorage.getItem("schoolSettings")
        ) || {};


    const schoolName =
        settings.schoolName ||
        localStorage.getItem("schoolName") ||
        "د مکتب اداره";


    const adminName =
        settings.adminName ||
        localStorage.getItem("adminName") ||
        "مدیر";


    const schoolPhone =
        settings.schoolPhone ||
        localStorage.getItem("schoolPhone") ||
        "ثبت شوی نه دی";


    const schoolId =
        localStorage.getItem("schoolId") ||
        "ثبت شوی نه دی";


    const licenseKey =
        localStorage.getItem("licenseKey") ||
        "ثبت شوی نه دی";


    const licenseExpire =
        localStorage.getItem("licenseExpire") ||
        "";


    let expireText =
        "ثبت شوی نه دی";


    if(licenseExpire){

        const date =
            new Date(licenseExpire);

        if(!isNaN(date.getTime())){

            expireText =
                date.toLocaleDateString("ps-AF");

        }

    }


    document.getElementById("content").innerHTML = `

        <div class="card">

            <div class="school-logo">
                🏫
            </div>


            <h2 class="school-name">
                ${escapeHtml(schoolName)}
            </h2>


            <div class="info">

                <div class="row">

                    <span class="label">
                        🏫 د مکتب نوم
                    </span>

                    <span class="value">
                        ${escapeHtml(schoolName)}
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        👨‍💼 مدیر
                    </span>

                    <span class="value">
                        ${escapeHtml(adminName)}
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        📞 د اړیکې شمېره
                    </span>

                    <span class="value">
                        ${escapeHtml(schoolPhone)}
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        🆔 د مکتب ID
                    </span>

                    <span class="value">
                        ${escapeHtml(schoolId)}
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        🔑 License
                    </span>

                    <span class="value">
                        ${escapeHtml(licenseKey)}
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        📅 License ختمېدل
                    </span>

                    <span class="value">
                        ${escapeHtml(expireText)}
                    </span>

                </div>

            </div>

        </div>


        <div class="card">

            <h3>📋 د مکتب په اړه</h3>

            <p class="description">

                دا د ښوونځي د مدیریت سیستم دی.
                په دې سیستم کې د شاګردانو، ښوونکو،
                حاضري، فیسونو، راپورونو او نورو
                مهمو معلوماتو مدیریت ترسره کېږي.

            </p>

        </div>


        <div class="buttons">

            <button
                class="btn print"
                onclick="window.print()"
            >
                🖨️ چاپ
            </button>


            ${
                schoolPhone !== "ثبت شوی نه دی"
                ?
                `
                <a
                    class="btn phone"
                    href="tel:${escapeHtml(schoolPhone)}"
                >
                    📞 اړیکه
                </a>
                `
                :
                ""
            }

        </div>

    `;

}


loadSchoolInfo();

</script>

</body>
</html>
