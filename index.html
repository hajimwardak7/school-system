<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - School Management System</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd 0%,
                    #084298 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        /* BACKGROUND CIRCLES */

        body::before {

            content: "";

            position: fixed;

            width: 300px;

            height: 300px;

            background:
                rgba(255,255,255,.08);

            border-radius: 50%;

            top: -100px;

            right: -80px;

        }


        body::after {

            content: "";

            position: fixed;

            width: 250px;

            height: 250px;

            background:
                rgba(255,255,255,.06);

            border-radius: 50%;

            bottom: -100px;

            left: -80px;

        }


        /* LOGIN BOX */

        .login-box {

            width: 100%;

            max-width: 460px;

            background: white;

            border-radius: 30px;

            padding: 30px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.25);

            position: relative;

            z-index: 2;

        }


        /* LOGO */

        .logo {

            width: 105px;

            height: 105px;

            margin:
                0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #084298
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 52px;

            box-shadow:
                0 10px 25px
                rgba(13,110,253,.35);

        }


        h1 {

            text-align: center;

            color: #123;

            font-size: 28px;

            margin-bottom: 7px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 15px;

            margin-bottom: 25px;

        }


        /* ACCOUNT TYPE */

        .account-title {

            font-size: 17px;

            font-weight: bold;

            color: #333;

            margin-bottom: 12px;

        }


        .account-types {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-bottom: 25px;

        }


        .account-option {

            position: relative;

        }


        .account-option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;

        }


        .account-card {

            border: 2px solid #e4e7eb;

            border-radius: 18px;

            padding: 18px 10px;

            text-align: center;

            cursor: pointer;

            transition: .25s;

            background: #fafafa;

        }


        .account-card:hover {

            border-color: #0d6efd;

            transform: translateY(-2px);

        }


        .account-icon {

            font-size: 38px;

            margin-bottom: 7px;

        }


        .account-name {

            font-size: 17px;

            font-weight: bold;

            color: #333;

        }


        .account-desc {

            font-size: 12px;

            color: #888;

            margin-top: 4px;

        }


        .account-option input:checked
        + .account-card {

            border-color: #0d6efd;

            background:
                #eef5ff;

            box-shadow:
                0 5px 15px
                rgba(13,110,253,.15);

        }


        .account-option input:checked
        + .account-card
        .account-name {

            color: #0d6efd;

        }


        /* LABEL */

        label.field-label {

            display: block;

            font-size: 17px;

            font-weight: bold;

            color: #333;

            margin-bottom: 8px;

        }


        /* INPUT */

        .input-box {

            position: relative;

            margin-bottom: 20px;

        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 20px;

            color: #777;

        }


        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding:
                16px 50px 16px 45px;

            border:
                2px solid #e4e7eb;

            border-radius: 15px;

            font-size: 17px;

            outline: none;

            direction: ltr;

            text-align: left;

            transition: .2s;

            background: #fafafa;

        }


        input[type="email"]:focus,
        input[type="password"]:focus {

            border-color: #0d6efd;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(13,110,253,.08);

        }


        /* SHOW PASSWORD */

        .show-password {

            position: absolute;

            left: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            font-size: 20px;

            cursor: pointer;

            color: #666;

            width: auto;

            padding: 5px;

        }


        /* LOGIN BUTTON */

        #loginBtn {

            width: 100%;

            padding: 17px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #084298
                );

            color: white;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(13,110,253,.25);

            transition: .2s;

        }


        #loginBtn:hover {

            transform:
                translateY(-2px);

        }


        #loginBtn:disabled {

            opacity: .65;

            cursor: not-allowed;

            transform: none;

        }


        /* MESSAGE */

        .message {

            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 14px;

            text-align: center;

            font-size: 15px;

            line-height: 1.8;

        }


        .error {

            display: block;

            background: #f8d7da;

            color: #842029;

        }


        .success {

            display: block;

            background: #d1e7dd;

            color: #0f5132;

        }


        .loading {

            display: block;

            background: #cff4fc;

            color: #055160;

        }


        /* FOOTER */

        .footer {

            text-align: center;

            margin-top: 22px;

            color: #999;

            font-size: 13px;

        }


        @media (max-width: 400px) {

            .login-box {

                padding: 22px;

            }


            .account-card {

                padding: 14px 7px;

            }


            .account-icon {

                font-size: 32px;

            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">
        🏫
    </div>


    <h1>
        د مکتب مدیریت سیستم
    </h1>


    <div class="subtitle">
        خپل حساب انتخاب او Login وکړئ
    </div>



    <form id="loginForm">


        <!-- ACCOUNT TYPE -->

        <div class="account-title">
            👤 د حساب ډول انتخاب کړئ
        </div>


        <div class="account-types">


            <!-- ADMIN -->

            <label class="account-option">

                <input
                    type="radio"
                    name="accountType"
                    value="admin"
                >

                <div class="account-card">

                    <div class="account-icon">
                        👨‍💼
                    </div>

                    <div class="account-name">
                        مدیر
                    </div>

                    <div class="account-desc">
                        د سیستم بشپړ لاسرسی
                    </div>

                </div>

            </label>



            <!-- TEACHER -->

            <label class="account-option">

                <input
                    type="radio"
                    name="accountType"
                    value="teacher"
                    checked
                >

                <div class="account-card">

                    <div class="account-icon">
                        👨‍🏫
                    </div>

                    <div class="account-name">
                        استاد
                    </div>

                    <div class="account-desc">
                        یوازې حاضري
                    </div>

                </div>

            </label>


        </div>



        <!-- EMAIL -->

        <label class="field-label">
            📧 Email
        </label>


        <div class="input-box">

            <span class="input-icon">
                ✉️
            </span>

            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required
                autocomplete="username"
            >

        </div>



        <!-- PASSWORD -->

        <label class="field-label">
            🔑 Password
        </label>


        <div class="input-box">

            <span class="input-icon">
                🔒
            </span>

            <input
                type="password"
                id="password"
                placeholder="Password ولیکئ"
                required
                autocomplete="current-password"
            >

            <button
                type="button"
                class="show-password"
                id="showPassword"
            >
                👁️
            </button>

        </div>



        <!-- LOGIN -->

        <button
            type="submit"
            id="loginBtn"
        >
            🔐 Login
        </button>


    </form>



    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <div class="footer">
        School Management System © 2026
    </div>


</div>



<script type="module">


    import {
        signInWithEmailAndPassword,
        signOut
    }
    from
    "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    import {
        collection,
        getDocs
    }
    from
    "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    import {
        auth,
        db
    }
    from "./firebase.js";



    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    const message =
        document.getElementById(
            "message"
        );


    const showPassword =
        document.getElementById(
            "showPassword"
        );



    /*
    =====================================
    SHOW / HIDE PASSWORD
    =====================================
    */

    showPassword.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                showPassword.textContent =
                    "🙈";

            } else {

                passwordInput.type =
                    "password";

                showPassword.textContent =
                    "👁️";

            }

        }
    );



    /*
    =====================================
    MESSAGE
    =====================================
    */

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;

    }



    /*
    =====================================
    EMAIL
    =====================================
    */

    function normalizeEmail(
        email
    ) {

        return String(email || "")
            .trim()
            .toLowerCase();

    }



    /*
    =====================================
    FIND TEACHER
    =====================================
    */

    async function findTeacherByEmail(
        email
    ) {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "teachers"
                )
            );


        let teacher = null;


        snapshot.forEach(
            function(docSnap) {

                const data =
                    docSnap.data();


                const teacherEmail =
                    normalizeEmail(
                        data.email
                    );


                if (
                    teacherEmail ===
                    email
                ) {

                    teacher = {

                        id:
                            docSnap.id,

                        ...data

                    };

                }

            }
        );


        return teacher;

    }



    /*
    =====================================
    LOGIN
    =====================================
    */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const selected =
                document.querySelector(
                    'input[name="accountType"]:checked'
                );


            if (!selected) {

                showMessage(
                    "مهرباني وکړئ د حساب ډول انتخاب کړئ ❌",
                    "error"
                );

                return;

            }


            const accountType =
                selected.value;


            const email =
                normalizeEmail(
                    emailInput.value
                );


            const password =
                passwordInput.value;


            if (
                !email ||
                !password
            ) {

                showMessage(
                    "Email او Password دواړه ولیکئ ❌",
                    "error"
                );

                return;

            }


            loginBtn.disabled =
                true;


            loginBtn.textContent =
                "Login روان دی...";


            showMessage(
                "مهرباني وکړئ لږ انتظار وکړئ...",
                "loading"
            );


            try {


                /*
                =================================
                FIREBASE LOGIN
                =================================
                */

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );



                /*
                =================================
                که استاد انتخاب شوی وي
                =================================
                */

                if (
                    accountType ===
                    "teacher"
                ) {


                    const teacher =
                        await findTeacherByEmail(
                            email
                        );


                    if (!teacher) {

                        await signOut(auth);


                        showMessage(
                            "دا Email د استاد په لست کې نشته ❌",
                            "error"
                        );


                        loginBtn.disabled =
                            false;


                        loginBtn.textContent =
                            "🔐 Login";


                        return;

                    }



                    /*
                    استاد معلومات
                    */

                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    localStorage.setItem(
                        "userRole",
                        "teacher"
                    );


                    localStorage.setItem(
                        "userName",
                        teacher.name ||
                        "ښوونکی"
                    );


                    localStorage.setItem(
                        "teacherId",
                        teacher.id
                    );


                    localStorage.setItem(
                        "teacherEmail",
                        email
                    );


                    localStorage.setItem(
                        "teacherClasses",
                        JSON.stringify(
                            Array.isArray(
                                teacher.classes
                            )
                            ? teacher.classes
                            : []
                        )
                    );


                    showMessage(
                        "استاد په بریالیتوب سره داخل شو ✅",
                        "success"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "dashboard.html";

                        },
                        700
                    );


                    return;

                }



                /*
                =================================
                که مدیر انتخاب شوی وي
                =================================
                */

                if (
                    accountType ===
                    "admin"
                ) {


                    /*
                    که دا Email د استاد وي
                    نو Admin ته یې مه پرېږده
                    */

                    const teacher =
                        await findTeacherByEmail(
                            email
                        );


                    if (teacher) {

                        await signOut(auth);


                        showMessage(
                            "دا حساب د استاد حساب دی 👨‍🏫. مهرباني وکړئ «استاد» انتخاب کړئ.",
                            "error"
                        );


                        loginBtn.disabled =
                            false;


                        loginBtn.textContent =
                            "🔐 Login";


                        return;

                    }



                    /*
                    مدیر Login
                    */

                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    localStorage.setItem(
                        "userRole",
                        "admin"
                    );


                    localStorage.setItem(
                        "userName",
                        email
                    );


                    localStorage.removeItem(
                        "teacherId"
                    );


                    localStorage.removeItem(
                        "teacherEmail"
                    );


                    localStorage.removeItem(
                        "teacherClasses"
                    );


                    showMessage(
                        "مدیر په بریالیتوب سره داخل شو ✅",
                        "success"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "dashboard.html";

                        },
                        700
                    );


                }


            }

            catch (error) {


                console.error(
                    "Login Error:",
                    error
                );


                let errorMessage =
                    "Email یا Password غلط دی ❌";



                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorMessage =
                        "Email یا Password غلط دی ❌";

                }


                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    errorMessage =
                        "دا Email په Firebase Authentication کې نشته ❌";

                }


                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    errorMessage =
                        "Password غلط دی ❌";

                }


                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "Email ناسم دی ❌";

                }


                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage =
                        "ډېرې هڅې شوې دي. لږ وروسته بیا هڅه وکړئ ⚠️";

                }


                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    errorMessage =
                        "Internet ستونزه لري ❌";

                }


                else if (
                    error.code ===
                    "permission-denied"
                ) {

                    errorMessage =
                        "Firebase اجازه نه درکوي. Firestore Rules وګورئ ❌";

                }


                showMessage(
                    errorMessage,
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "🔐 Login";

            }

        }
    );

</script>


</body>

</html>
