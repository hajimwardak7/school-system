<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د شاګرد لټون</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:white;
    padding:20px;
    text-align:center;
}

.header h2{
    margin:0;
}

.container{
    padding:15px;
    max-width:700px;
    margin:auto;
}

.back{
    display:block;
    background:white;
    color:#0d6efd;
    padding:13px;
    border-radius:12px;
    text-decoration:none;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.search-box{
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.search-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.search-box input:focus{
    border-color:#0d6efd;
}

.count{
    margin-top:10px;
    color:#666;
}

.student{
    background:white;
    border-radius:15px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.student h3{
    margin:0 0 12px;
    color:#0d6efd;
}

.info{
    line-height:2;
    font-size:15px;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.btn{
    flex:1;
    border:0;
    padding:11px;
    border-radius:10px;
    text-decoration:none;
    text-align:center;
    cursor:pointer;
    font-size:14px;
}

.profile{
    background:#0d6efd;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.empty{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:15px;
    color:#777;
}

.loading{
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<div class="header">
    <h2>🔎 د شاګردانو لټون</h2>
</div>

<div class="container">

    <a href="dashboard.html" class="back">
        ⬅️ Dashboard ته بېرته
    </a>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="د شاګرد نوم، د پلار نوم یا ټولګی ولیکئ..."
            oninput="searchStudents()"
        >

        <div class="count" id="count">
            شاګردان: 0
        </div>

    </div>

    <div id="studentsList">
        <div class="loading">
            ⏳ معلومات لوډ کېږي...
        </div>
    </div>

</div>


<script type="module">

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import { db } from "./firebase.js";


let students = [];


/* =========================
   HTML SAFE
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   FIREBASE STUDENTS
========================= */

async function loadStudents(){

    try{

        const snapshot =
            await getDocs(collection(db,"students"));

        students = [];

        snapshot.forEach(docSnap => {

            const data = docSnap.data();

            students.push({

                id: docSnap.id,

                name: data.name || "",

                father: data.father || "",

                className: data.className || "",

                whatsapp: data.whatsapp || ""

            });

        });


        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );


    }catch(error){

        console.log(
            "Firebase error:",
            error
        );

        students =
            JSON.parse(
                localStorage.getItem("students")
            ) || [];
    }


    displayStudents(students);
}


/* =========================
   DISPLAY STUDENTS
========================= */

function displayStudents(list){

    const box =
        document.getElementById("studentsList");

    const count =
        document.getElementById("count");


    count.textContent =
        "شاګردان: " + list.length;


    if(list.length === 0){

        box.innerHTML = `
            <div class="empty">
                😔 هېڅ شاګرد پیدا نه شو
            </div>
        `;

        return;
    }


    box.innerHTML =
        list.map(student => {

            let whatsapp = "";

            if(student.whatsapp){

                let number =
                    String(student.whatsapp)
                    .replace(/\D/g,"");

                if(number.startsWith("0")){

                    number =
                        "93" + number.substring(1);

                }else if(!number.startsWith("93")){

                    number =
                        "93" + number;
                }


                const message =
                    encodeURIComponent(
                        "سلام، د " +
                        student.name +
                        " د حاضري/مکتب په اړه معلومات."
                    );


                whatsapp = `
                    <a
                        class="btn whatsapp"
                        href="https://wa.me/${number}?text=${message}"
                        target="_blank"
                    >
                        📱 WhatsApp
                    </a>
                `;
            }


            return `

                <div class="student">

                    <h3>
                        👨‍🎓 ${escapeHtml(student.name)}
                    </h3>

                    <div class="info">

                        👨‍👦
                        <b>د پلار نوم:</b>
                        ${escapeHtml(student.father)}
                        <br>

                        📚
                        <b>ټولګی:</b>
                        ${escapeHtml(student.className)}
                        <br>

                        📱
                        <b>WhatsApp:</b>
                        ${escapeHtml(student.whatsapp || "ثبت شوی نه دی")}

                    </div>


                    <div class="buttons">

                        <a
                            class="btn profile"
                            href="student-profile.html?id=${encodeURIComponent(student.id)}"
                        >
                            👤 پروفایل
                        </a>

                        ${whatsapp}

                    </div>

                </div>

            `;

        }).join("");
}


/* =========================
   SEARCH
========================= */

window.searchStudents = function(){

    const value =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    if(!value){

        displayStudents(students);

        return;
    }


    const result =
        students.filter(student => {

            const name =
                String(student.name || "")
                .toLowerCase();

            const father =
                String(student.father || "")
                .toLowerCase();

            const className =
                String(student.className || "")
                .toLowerCase();

            const whatsapp =
                String(student.whatsapp || "")
                .toLowerCase();


            return (

                name.includes(value) ||

                father.includes(value) ||

                className.includes(value) ||

                whatsapp.includes(value)

            );

        });


    displayStudents(result);
};


/* =========================
   START
========================= */

loadStudents();

</script>

</body>
</html>
