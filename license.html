<!DOCTYPE html>
<html lang="ps">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>د سیستم فعالول</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    direction:rtl;
    font-family:Arial,sans-serif;
    background:#f2f6fc;
}

.container{
    max-width:500px;
    margin:40px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.header{
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 10px;
}

.header p{
    margin:0;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:17px;
    margin-bottom:15px;
    direction:ltr;
    text-align:left;
    outline:none;
}

input:focus{
    border-color:#0d6efd;
    box-shadow:0 0 0 3px rgba(13,110,253,.10);
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#0d6efd;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    display:none;
    line-height:1.8;
}

.success{
    display:block;
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    display:block;
    background:#f8d7da;
    color:#842029;
}

.info{
    display:block;
    background:#cff4fc;
    color:#055160;
}

.school{
    margin-top:20px;
    padding:15px;
    background:#f8f9fa;
    border-radius:10px;
    line-height:2;
}

.small{
    color:#777;
    font-size:14px;
    margin-top:15px;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🔐 د سیستم فعالول</h1>

<p>School Management System</p>

</div>

<div class="card">

<label>
🔑 License Key
</label>

<input
type="text"
id="licenseKey"
placeholder="SCHOOL-2026-001"
autocomplete="off">

<label>
🏫 School ID
</label>

<input
type="text"
id="schoolId"
placeholder="GHAZNI-001"
autocomplete="off">

<button
id="activateBtn">

🔓 سیستم فعال کړه

</button>

<div
id="message"
class="message">
</div>

<div
id="schoolInfo"
class="school"
style="display:none;">
</div>

<div class="small">

ستاسې License باید د سیستم له مالک څخه ترلاسه شي.

</div>

</div>

</div>


<script type="module">

// ==================================================
// Firebase
// ==================================================

import {
    doc,
    getDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import { db } from "./firebase.js";


// ==================================================
// Elements
// ==================================================

const licenseInput =
    document.getElementById("licenseKey");

const schoolInput =
    document.getElementById("schoolId");

const activateBtn =
    document.getElementById("activateBtn");

const messageBox =
    document.getElementById("message");

const schoolInfo =
    document.getElementById("schoolInfo");


// ==================================================
// Device ID
// ==================================================

function getDeviceId(){

    let deviceId =
        localStorage.getItem("schoolDeviceId");

    if(!deviceId){

        const randomPart =
            Math.random()
            .toString(36)
            .substring(2,12);

        const timePart =
            Date.now()
            .toString(36);

        deviceId =
            "DEVICE-" +
            timePart +
            "-" +
            randomPart;

        localStorage.setItem(
            "schoolDeviceId",
            deviceId
        );
    }

    return deviceId;
}


// ==================================================
// Message
// ==================================================

function showMessage(text,type){

    messageBox.className =
        "message " + type;

    messageBox.innerHTML =
        text;
}


// ==================================================
// Today
// ==================================================

function getToday(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


// ==================================================
// Reset Button
// ==================================================

function resetButton(){

    activateBtn.disabled =
        false;

    activateBtn.textContent =
        "🔓 سیستم فعال کړه";
}


// ==================================================
// Activate License
// ==================================================

activateBtn.addEventListener(
    "click",
    activateLicense
);


async function activateLicense(){

    const key =
        licenseInput.value.trim();

    const schoolId =
        schoolInput.value.trim();


    // ==============================================
    // Validation
    // ==============================================

    if(!key){

        showMessage(
            "⚠️ License Key ولیکه.",
            "error"
        );

        licenseInput.focus();

        return;
    }


    if(!schoolId){

        showMessage(
            "⚠️ School ID ولیکه.",
            "error"
        );

        schoolInput.focus();

        return;
    }


    activateBtn.disabled =
        true;

    activateBtn.textContent =
        "⏳ License تاییدېږي...";


    try{

        // ==========================================
        // License Document
        // ==========================================

        const licenseRef =
            doc(
                db,
                "licenses",
                key
            );


        const licenseSnap =
            await getDoc(
                licenseRef
            );


        // ==========================================
        // Not Found
        // ==========================================

        if(
            !licenseSnap.exists()
        ){

            showMessage(
                "❌ دا License Key ناسم دی یا په Firebase کې موجود نه دی.",
                "error"
            );

            resetButton();

            return;
        }


        const license =
            licenseSnap.data();


        // ==========================================
        // Active
        // ==========================================

        if(
            license.active !== true
        ){

            showMessage(
                "🚫 دا License اوس غیر فعال شوی دی.",
                "error"
            );

            resetButton();

            return;
        }


        // ==========================================
        // School ID
        // ==========================================

        const firebaseSchoolId =
            String(
                license.schoolId || ""
            ).trim();


        if(
            firebaseSchoolId !== schoolId
        ){

            showMessage(
                "❌ School ID د دې License سره برابر نه دی.",
                "error"
            );

            resetButton();

            return;
        }


        // ==========================================
        // Expiry
        // ==========================================

        const today =
            getToday();


        const expiresAt =
            String(
                license.expiresAt || ""
            ).trim();


        if(!expiresAt){

            showMessage(
                "❌ د License د ختمېدو نېټه نشته.",
                "error"
            );

            resetButton();

            return;
        }


        if(
            expiresAt < today
        ){

            showMessage(
                "❌ ستاسې License ختم شوی دی.<br><br>" +
                "📅 د ختمېدو نېټه: " +
                escapeHtml(expiresAt),
                "error"
            );

            resetButton();

            return;
        }


        // ==========================================
        // Device
        // ==========================================

        const deviceId =
            getDeviceId();


        const registeredDevice =
            String(
                license.deviceId || ""
            ).trim();


        // ==========================================
        // Already connected to another Device
        // ==========================================

        if(
            registeredDevice &&
            registeredDevice !== deviceId
        ){

            showMessage(
                "🚫 دا License مخکې په بل Device کې فعال شوی دی.",
                "error"
            );

            resetButton();

            return;
        }


        // ==========================================
        // Register Device
        // ==========================================

        if(
            !registeredDevice
        ){

            activateBtn.textContent =
                "⏳ Device ثبتېږي...";


            await updateDoc(
                licenseRef,
                {
                    deviceId: deviceId,
                    lastActivatedAt: new Date()
                }
            );
        }


        // ==========================================
        // Local Storage
        // ==========================================

        localStorage.setItem(
            "licenseActive",
            "true"
        );

        localStorage.setItem(
            "licenseKey",
            key
        );

        localStorage.setItem(
            "schoolId",
            schoolId
        );

        localStorage.setItem(
            "schoolName",
            license.schoolName || ""
        );

        localStorage.setItem(
            "licenseExpiresAt",
            expiresAt
        );

        localStorage.setItem(
            "licenseDeviceId",
            deviceId
        );


        // ==========================================
        // School Info
        // ==========================================

        schoolInfo.style.display =
            "block";


        schoolInfo.innerHTML =

            "🏫 <b>مکتب:</b> " +
            escapeHtml(
                license.schoolName || "-"
            ) +

            "<br>" +

            "🆔 <b>School ID:</b> " +
            escapeHtml(
                license.schoolId || "-"
            ) +

            "<br>" +

            "📅 <b>ختمېدو نېټه:</b> " +
            escapeHtml(
                expiresAt
            );


        // ==========================================
        // Success
        // ==========================================

        showMessage(

            "✅ License په بریالیتوب فعال شو.<br>" +
            "🏫 مکتب ثبت شو.<br>" +
            "⏳ سیستم ته داخلېږې...",

            "success"
        );


        activateBtn.textContent =
            "✅ فعال شو";


        // ==========================================
        // Go Login
        // ==========================================

        setTimeout(
            function(){

                window.location.href =
                    "index.html";

            },
            1500
        );


    }catch(error){

        console.error(
            "LICENSE ERROR:",
            error
        );


        let errorText =
            error.message || "Unknown error";


        showMessage(

            "❌ د License د تایید پر مهال ستونزه راغله.<br><br>" +

            "<small>" +
            escapeHtml(errorText) +
            "</small>",

            "error"
        );


        resetButton();
    }

}


// ==================================================
// HTML Escape
// ==================================================

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


// ==================================================
// Load Existing License
// ==================================================

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const active =
            localStorage.getItem(
                "licenseActive"
            );


        const key =
            localStorage.getItem(
                "licenseKey"
            );


        const schoolId =
            localStorage.getItem(
                "schoolId"
            );


        if(
            active === "true" &&
            key &&
            schoolId
        ){

            licenseInput.value =
                key;

            schoolInput.value =
                schoolId;
        }

    }
);

</script>

</body>

</html>
