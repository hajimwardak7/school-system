<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د ښوونکو مدیریت</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f6f9;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h2{
    margin:0 0 7px;
}

/* CONTAINER */

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

/* BACK BUTTON */

.back{
    display:block;
    background:white;
    color:#0d6efd;
    padding:13px;
    border-radius:12px;
    text-align:center;
    text-decoration:none;
    margin-bottom:15px;
    font-weight:bold;
}

/* CARD */

.card{
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
    margin-top:0;
    color:#0d6efd;
}

/* INPUT */

label{
    display:block;
    font-weight:bold;
    margin:10px 0 6px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#0d6efd;
}

/* GENERAL BUTTON */

button{
    border:0;
    border-radius:10px;
    padding:12px 15px;
    cursor:pointer;
    font-size:15px;
}

/* SAVE */

.save{
    width:100%;
    margin-top:15px;
    background:#0d6efd !important;
    color:white !important;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(13,110,253,.25);
}

.save:disabled{
    background:#777 !important;
    cursor:not-allowed;
}

/* CLASS BUTTON */

.class-button{
    width:100%;
    background:#e7f0ff !important;
    color:#0d6efd !important;
    margin-top:8px;
    font-weight:bold;
    border:1px solid #c9dcff;
}

/* CLASSES */

.classes{
    display:none;
    margin-top:10px;
    padding:12px;
    background:#f4f6f9;
    border-radius:10px;
}

.class-item{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:white;
    padding:8px;
    margin:4px;
    border-radius:8px;
    border:1px solid #ddd;
}

.class-item input{
    width:auto;
}

/* TEACHER CARD */

.teacher{
    background:white;
    padding:17px;
    border-radius:15px;
    margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    border:1px solid #eee;
}

.teacher h3{
    margin:0 0 10px;
    color:#0d6efd;
}

.info{
    line-height:2;
    color:#555;
    word-break:break-word;
}

/* ACTION BUTTONS */

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

/* EDIT BUTTON */

.actions .edit{
    flex:1;
    background:#ffc107 !important;
    color:#000 !important;
    border:2px solid #e0a800 !important;
    font-weight:bold;
    min-height:50px;
    font-size:16px;
    box-shadow:0 3px 8px #rgba(0,0,0,.15);
}

/* DELETE BUTTON */

.actions .delete{
    flex:1;
    background:#dc3545 !important;
    color: #0d6efd !important;
    border:2px solid #b02a37 !important;
    font-weight:bold;
    min-height:50px;
    font-size:16px;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
}

/* BUTTON PRESS */

.actions .edit:active{
    background:#e0a800 !important;
    transform:scale(.98);
}

.actions .delete:active{
    background:#b02a37 !important;
    transform:scale(.98);
}

/* MESSAGE */

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:12px;
    line-height:1.8;
    word-break:break-word;
}

.success{
    display:block;
    background:#d1e7dd;
    color:#0f5132;
    border:1px solid #a3cfbb;
}

.error{
    display:block;
    background:#f8d7da;
    color:#842029;
    border:1px solid #f1aeb5;
}

/* FIREBASE ERROR */

.firebase-error{
    direction:ltr;
    text-align:left;
    background:#fff;
    border:1px solid #dc3545;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    font-size:13px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

/* LOADING */

.loading{
    text-align:center;
    padding:20px;
    color:#777;
}

.empty{
    text-align:center;
    padding:20px;
    color:#777;
}

/* MOBILE */

@media(max-width:450px){

    .actions{
        gap:8px;
    }

    .actions button{
        font-size:15px;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

    <h2>👨‍🏫 د ښوونکو مدیریت</h2>

    <div>
        د ښوونکو معلومات او Login Email
    </div>

</div>


<div class="container">


<!-- BACK -->

<a href="dashboard.html" class="back">
    ⬅️ Dashboard ته بېرته
</a>


<!-- MESSAGE -->

<div id="message" class="message"></div>


<!-- ADD TEACHER -->

<div class="card">

    <h3>
        ➕ نوی ښوونکی
    </h3>


    <label>
        👨‍🏫 د ښوونکي نوم
    </label>

    <input
        type="text"
        id="teacherName"
        placeholder="مثلاً: احمد"
        autocomplete="name"
    >


    <label>
        📧 Firebase Login Email
    </label>

    <input
        type="email"
        id="teacherEmail"
        placeholder="teacher@gmail.com"
        dir="ltr"
        autocomplete="email"
    >


    <label>
        👤 Username
    </label>

    <input
        type="text"
        id="teacherUsername"
        placeholder="ahmad"
        dir="ltr"
        autocomplete="username"
    >


    <!-- CLASS BUTTON -->

    <button
        type="button"
        class="class-button"
        onclick="toggleClasses()"
    >
        📚 ټولګي انتخاب کړئ ▼
    </button>


    <!-- CLASS LIST -->

    <div id="classBox" class="classes">


        <div class="class-item">
            <input type="checkbox" value="اول">
            اول
        </div>


        <div class="class-item">
            <input type="checkbox" value="دوهم">
            دوهم
        </div>


        <div class="class-item">
            <input type="checkbox" value="درېیم">
            درېیم
        </div>


        <div class="class-item">
            <input type="checkbox" value="څلورم">
            څلورم
        </div>


        <div class="class-item">
            <input type="checkbox" value="پنځم">
            پنځم
        </div>


        <div class="class-item">
            <input type="checkbox" value="شپږم">
            شپږم
        </div>


        <div class="class-item">
            <input type="checkbox" value="اووم">
            اووم
        </div>


        <div class="class-item">
            <input type="checkbox" value="اتم">
            اتم
        </div>


        <div class="class-item">
            <input type="checkbox" value="نهم">
            نهم
        </div>


        <div class="class-item">
            <input type="checkbox" value="لسم">
            لسم
        </div>


        <div class="class-item">
            <input type="checkbox" value="یوولسم">
            یوولسم
        </div>


        <div class="class-item">
            <input type="checkbox" value="دولسم">
            دولسم
        </div>


    </div>


    <!-- SAVE -->

    <button
        id="saveTeacherBtn"
        type="button"
        class="save"
        onclick="addTeacher()"
    >
        💾 ښوونکی ثبت کړه
    </button>

</div>


<!-- TEACHERS LIST -->

<div class="card">

    <h3>
        📋 د ښوونکو لست
    </h3>


    <div id="teachersList">

        <div class="loading">
            ⏳ معلومات لوډ کېږي...
        </div>

    </div>

</div>


</div>


<script type="module">


/* =========================================
   FIREBASE IMPORT
========================================= */

import {

    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    query,
    where

} from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


import {

    db,
    auth

} from "./firebase.js";


/* =========================================
   VARIABLES
========================================= */

let teachers = [];


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.innerHTML = text;

    box.className =
        "message " + type;

}


/* =========================================
   CHECK FIREBASE LOGIN
========================================= */

function checkFirebaseLogin(){

    if(!auth.currentUser){

        showMessage(

            "❌ Firebase Login فعال نه دی.<br><br>" +

            "لومړی خپل حساب ته Login شئ، بیا هڅه وکړئ.",

            "error"

        );

        return false;

    }

    return true;

}


/* =========================================
   FIREBASE ERROR
========================================= */

function showFirebaseError(error){

    console.error(
        "Firebase Error:",
        error
    );


    const code =
        error?.code ||
        "unknown";


    const message =
        error?.message ||
        "Unknown Firebase error.";


    showMessage(

        `
        <b>❌ عملیات ترسره نه شول.</b>

        <br><br>

        <b>Firebase Error:</b>

        <div class="firebase-error">
Code: ${escapeHtml(code)}

${escapeHtml(message)}
        </div>
        `,

        "error"

    );

}


/* =========================================
   TOGGLE CLASSES
========================================= */

window.toggleClasses =
function(){

    const box =
        document.getElementById(
            "classBox"
        );


    if(
        box.style.display === "block"
    ){

        box.style.display = "none";

    }else{

        box.style.display = "block";

    }

};


/* =========================================
   LOAD TEACHERS
========================================= */

async function loadTeachers(){

    const box =
        document.getElementById(
            "teachersList"
        );


    box.innerHTML = `

        <div class="loading">
            ⏳ د ښوونکو معلومات لوډ کېږي...
        </div>

    `;


    try{

        if(!auth.currentUser){

            throw new Error(
                "Firebase Authentication user not found."
            );

        }


        const snapshot =
            await getDocs(

                collection(
                    db,
                    "teachers"
                )

            );


        teachers = [];


        snapshot.forEach(

            function(docSnap){

                teachers.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }

        );


        localStorage.setItem(

            "teachers",

            JSON.stringify(
                teachers
            )

        );


        displayTeachers();


    }catch(error){

        console.error(
            "Load Teachers Error:",
            error
        );


        try{

            teachers =
                JSON.parse(

                    localStorage.getItem(
                        "teachers"
                    )

                ) || [];

        }catch(e){

            teachers = [];

        }


        displayTeachers();


        if(error?.code){

            showFirebaseError(error);

        }

    }

}


/* =========================================
   DISPLAY TEACHERS
========================================= */

function displayTeachers(){

    const box =
        document.getElementById(
            "teachersList"
        );


    if(
        teachers.length === 0
    ){

        box.innerHTML = `

            <div class="empty">

                👨‍🏫 تر اوسه ښوونکی ثبت شوی نه دی.

            </div>

        `;

        return;

    }


    box.innerHTML =

        teachers.map(

            function(teacher){

                const classes =

                    Array.isArray(
                        teacher.classes
                    )

                    ?

                    teacher.classes.join("، ")

                    :

                    "ټولګی نشته";


                return `

                <div class="teacher">


                    <h3>

                        👨‍🏫

                        ${escapeHtml(
                            teacher.name || ""
                        )}

                    </h3>


                    <div class="info">


                        📧

                        <b>Email:</b>

                        ${escapeHtml(
                            teacher.email ||
                            "ثبت نه دی"
                        )}


                        <br>


                        👤

                        <b>Username:</b>

                        ${escapeHtml(
                            teacher.username ||
                            ""
                        )}


                        <br>


                        📚

                        <b>ټولګي:</b>

                        ${escapeHtml(
                            classes
                        )}


                    </div>


                    <div class="actions">


                        <button

                            type="button"

                            class="edit"

                            onclick="editTeacher('${escapeJs(teacher.id)}')"

                        >

                            ✏️ Edit

                        </button>


                        <button

                            type="button"

                            class="delete"

                            onclick="deleteTeacher('${escapeJs(teacher.id)}')"

                        >

                            🗑️ Delete

                        </button>


                    </div>


                </div>

                `;

            }

        ).join("");

}


/* =========================================
   ADD TEACHER
========================================= */

window.addTeacher =
async function(){


    /* LOGIN */

    if(
        !checkFirebaseLogin()
    ){

        return;

    }


    const saveButton =
        document.getElementById(
            "saveTeacherBtn"
        );


    /* VALUES */

    const name =

        document
        .getElementById(
            "teacherName"
        )
        .value
        .trim();


    const email =

        document
        .getElementById(
            "teacherEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const username =

        document
        .getElementById(
            "teacherUsername"
        )
        .value
        .trim();


    /* CLASSES */

    const selectedClasses =

        Array.from(

            document.querySelectorAll(
                "#classBox input:checked"
            )

        ).map(

            function(checkbox){

                return checkbox.value;

            }

        );


    /* VALIDATION */

    if(!name){

        showMessage(
            "⚠️ د ښوونکي نوم ولیکئ.",
            "error"
        );

        return;

    }


    if(!email){

        showMessage(
            "⚠️ د ښوونکي Email ولیکئ.",
            "error"
        );

        return;

    }


    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        )
    ){

        showMessage(

            "⚠️ صحیح Email ولیکئ.<br>" +
            "مثال: teacher@gmail.com",

            "error"

        );

        return;

    }


    if(
        selectedClasses.length === 0
    ){

        showMessage(

            "⚠️ لږ تر لږه یو ټولګی انتخاب کړئ.",

            "error"

        );

        return;

    }


    /* DISABLE BUTTON */

    saveButton.disabled = true;

    saveButton.innerText =
        "⏳ ښوونکی ثبتېږي...";


    try{


        /* CHECK DUPLICATE EMAIL */

        const emailQuery =

            query(

                collection(
                    db,
                    "teachers"
                ),

                where(
                    "email",
                    "==",
                    email
                )

            );


        const emailSnapshot =

            await getDocs(
                emailQuery
            );


        if(
            !emailSnapshot.empty
        ){

            showMessage(

                "⚠️ دا Email لا دمخه د ښوونکو په لست کې موجود دی.",

                "error"

            );

            return;

        }


        /* TEACHER DATA */

        const teacherData = {

            name:
                name,

            email:
                email,

            username:
                username || email,

            classes:
                selectedClasses,

            role:
                "teacher",

            createdAt:
                new Date().toISOString()

        };


        /* SAVE FIREBASE */

        const result =

            await addDoc(

                collection(
                    db,
                    "teachers"
                ),

                teacherData

            );


        /* LOCAL ARRAY */

        teachers.push({

            id:
                result.id,

            ...teacherData

        });


        /* LOCAL STORAGE */

        localStorage.setItem(

            "teachers",

            JSON.stringify(
                teachers
            )

        );


        /* SUCCESS */

        showMessage(

            "✅ ښوونکی په بریالیتوب سره ثبت شو.<br><br>" +

            "👨‍🏫 نوم: " +
            escapeHtml(name) +

            "<br>" +

            "📧 Email: " +
            escapeHtml(email) +

            "<br>" +

            "📚 ټولګي: " +
            escapeHtml(
                selectedClasses.join("، ")
            ) +

            "<br><br>" +

            "⚠️ مهم: د دې ښوونکي د Login لپاره باید همدا Email په Firebase Authentication کې User ولري.",

            "success"

        );


        /* CLEAR */

        document
        .getElementById(
            "teacherName"
        )
        .value = "";


        document
        .getElementById(
            "teacherEmail"
        )
        .value = "";


        document
        .getElementById(
            "teacherUsername"
        )
        .value = "";


        document
        .querySelectorAll(
            "#classBox input"
        )
        .forEach(

            function(checkbox){

                checkbox.checked = false;

            }

        );


        document
        .getElementById(
            "classBox"
        )
        .style.display = "none";


        displayTeachers();


    }catch(error){

        showFirebaseError(error);

    }finally{

        saveButton.disabled = false;

        saveButton.innerText =
            "💾 ښوونکی ثبت کړه";

    }

};


/* =========================================
   EDIT TEACHER
========================================= */

window.editTeacher =
async function(id){


    if(
        !checkFirebaseLogin()
    ){

        return;

    }


    const teacher =

        teachers.find(

            function(item){

                return String(
                    item.id
                ) === String(id);

            }

        );


    if(!teacher){

        showMessage(
            "❌ ښوونکی پیدا نه شو.",
            "error"
        );

        return;

    }


    /* NAME */

    const name =

        prompt(

            "د ښوونکي نوم:",

            teacher.name || ""

        );


    if(
        name === null
    ){

        return;

    }


    if(
        !name.trim()
    ){

        showMessage(
            "⚠️ نوم خالي نشي پاتې کېدای.",
            "error"
        );

        return;

    }


    /* EMAIL */

    const email =

        prompt(

            "Email:",

            teacher.email || ""

        );


    if(
        email === null
    ){

        return;

    }


    const cleanEmail =

        email
        .trim()
        .toLowerCase();


    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            cleanEmail
        )
    ){

        showMessage(
            "⚠️ صحیح Email ولیکئ.",
            "error"
        );

        return;

    }


    /* USERNAME */

    const username =

        prompt(

            "Username:",

            teacher.username ||
            cleanEmail

        );


    if(
        username === null
    ){

        return;

    }


    /* CLASSES */

    const classesText =

        prompt(

            "ټولګي د کامې په وسیله ولیکئ:\nمثال: اول,دوهم,درېیم",

            Array.isArray(
                teacher.classes
            )

            ?

            teacher.classes.join(",")

            :

            ""

        );


    if(
        classesText === null
    ){

        return;

    }


    const classes =

        classesText
        .split(",")
        .map(

            function(item){

                return item.trim();

            }

        )
        .filter(

            function(item){

                return item !== "";

            }

        );


    if(
        classes.length === 0
    ){

        showMessage(

            "⚠️ لږ تر لږه یو ټولګی باید انتخاب وي.",

            "error"

        );

        return;

    }


    /* NEW DATA */

    const newData = {

        name:
            name.trim(),

        email:
            cleanEmail,

        username:
            username.trim() ||
            cleanEmail,

        classes:
            classes,

        role:
            "teacher"

    };


    try{


        await updateDoc(

            doc(
                db,
                "teachers",
                id
            ),

            newData

        );


        const index =

            teachers.findIndex(

                function(item){

                    return String(
                        item.id
                    ) === String(id);

                }

            );


        if(
            index !== -1
        ){

            teachers[index] = {

                ...teachers[index],

                ...newData

            };

        }


        localStorage.setItem(

            "teachers",

            JSON.stringify(
                teachers
            )

        );


        showMessage(

            "✅ د ښوونکي معلومات بدل شول.",

            "success"

        );


        displayTeachers();


    }catch(error){

        showFirebaseError(error);

    }

};


/* =========================================
   DELETE TEACHER
========================================= */

window.deleteTeacher =
async function(id){


    if(
        !checkFirebaseLogin()
    ){

        return;

    }


    const teacher =

        teachers.find(

            function(item){

                return String(
                    item.id
                ) === String(id);

            }

        );


    if(!teacher){

        return;

    }


    const confirmDelete =

        confirm(

            "ایا غواړئ دا ښوونکی حذف کړئ؟\n\n" +

            teacher.name

        );


    if(
        !confirmDelete
    ){

        return;

    }


    try{


        await deleteDoc(

            doc(
                db,
                "teachers",
                id
            )

        );


        teachers =

            teachers.filter(

                function(item){

                    return String(
                        item.id
                    ) !== String(id);

                }

            );


        localStorage.setItem(

            "teachers",

            JSON.stringify(
                teachers
            )

        );


        showMessage(

            "✅ ښوونکی حذف شو.",

            "success"

        );


        displayTeachers();


    }catch(error){

        showFirebaseError(error);

    }

};


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   ESCAPE JS
========================================= */

function escapeJs(value){

    return String(
        value ?? ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    )

    .replace(
        /"/g,
        '\\"'
    );

}
