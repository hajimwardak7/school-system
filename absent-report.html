<!-- =========================
     Firebase
========================= -->

<script type="module">

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import { db } from "./firebase.js";


// ==================================================
// نننۍ نېټه
// ==================================================

function getToday(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


// ==================================================
// Firebase Attendance
// IMPORTANT:
// attendance.html همدا Collection کاروي
// ==================================================

async function getAttendance(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "attendance"
                )
            );


        const records = [];


        snapshot.forEach(function(doc){

            records.push({

                id: doc.id,

                ...doc.data()

            });

        });


        console.log(
            "Firebase Attendance Records:",
            records
        );


        // LocalStorage ته هم ذخیره کړه

        localStorage.setItem(
            "attendanceRecords",
            JSON.stringify(records)
        );


        return records;


    }catch(error){

        console.error(
            "Firebase attendance error:",
            error
        );


        // که Firebase کار ونه کړي
        // LocalStorage استعمال کړه

        const data =
            localStorage.getItem(
                "attendanceRecords"
            );


        return data
            ? JSON.parse(data)
            : [];

    }

}


// ==================================================
// Firebase Students
// ==================================================

async function getStudents(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "students"
                )
            );


        const students = [];


        snapshot.forEach(function(doc){

            students.push({

                id: doc.id,

                ...doc.data()

            });

        });


        console.log(
            "Firebase Students:",
            students
        );


        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );


        return students;


    }catch(error){

        console.error(
            "Firebase students error:",
            error
        );


        const data =
            localStorage.getItem(
                "students"
            );


        return data
            ? JSON.parse(data)
            : [];

    }

}


// ==================================================
// WhatsApp Number
// ==================================================

function normalizeWhatsApp(number){

    let phone =
        String(number || "")
        .replace(/\D/g,"");


    if(!phone){

        return "";

    }


    // 0700000000
    if(
        phone.startsWith("0")
    ){

        phone =
            "93" +
            phone.substring(1);

    }


    // 700000000
    if(
        phone.length === 9 &&
        !phone.startsWith("0")
    ){

        phone =
            "93" +
            phone;

    }


    // 0093700000000
    if(
        phone.startsWith("0093")
    ){

        phone =
            phone.substring(2);

    }


    return phone;

}


// ==================================================
// WhatsApp
// ==================================================

window.sendWhatsApp = function(
    name,
    father,
    className,
    date,
    phone
){

    const number =
        normalizeWhatsApp(phone);


    if(!number){

        alert(
            "⚠️ د پلار WhatsApp نمبر ثبت شوی نه دی."
        );

        return;

    }


    const message =

        "السلام علیکم\n\n" +

        "محترم " +
        father +
        " صاحب!\n\n" +

        "ستاسو زوی/لور " +
        name +

        " د " +
        className +

        " ټولګي شاګرد دی.\n\n" +

        "📅 نېټه: " +
        date +

        "\n❌ نن په حاضري کې غیر حاضر دی.\n\n" +

        "د مکتب اداره";


    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

};


// ==================================================
// Load Report
// ==================================================

window.loadReport = async function(){

    const loading =
        document.getElementById(
            "loading"
        );


    const report =
        document.getElementById(
            "report"
        );


    const studentReport =
        document.getElementById(
            "studentReport"
        );


    loading.style.display =
        "block";


    report.style.display =
        "none";


    studentReport.innerHTML =
        "";


    try{

        // ==========================================
        // معلومات واخله
        // ==========================================

        const attendance =
            await getAttendance();


        const students =
            await getStudents();


        // ==========================================
        // انتخاب شوې نېټه
        // ==========================================

        const dateInput =
            document.getElementById(
                "date"
            );


        const selectedDate =
            dateInput.value;


        if(!selectedDate){

            alert(
                "⚠️ مهرباني وکړئ نېټه انتخاب کړئ."
            );

            loading.style.display =
                "none";

            return;

        }


        // ==========================================
        // انتخاب شوی ټولګی
        // ==========================================

        const selectedClass =
            document.getElementById(
                "className"
            ).value;


        // ==========================================
        // Debug
        // ==========================================

        console.log(
            "Selected Date:",
            selectedDate
        );

        console.log(
            "Selected Class:",
            selectedClass
        );

        console.log(
            "All Attendance:",
            attendance
        );


        // ==========================================
        // غیر حاضر ریکارډونه
        // ==========================================

        let absentRecords =
            attendance.filter(
                function(record){

                    const recordDate =
                        String(
                            record.date || ""
                        ).trim();


                    const status =
                        String(
                            record.status || ""
                        ).trim();


                    const dateMatch =
                        recordDate ===
                        selectedDate;


                    const statusMatch =

                        status ===
                        "غیر حاضر"

                        ||

                        status.toLowerCase() ===
                        "absent"

                        ||

                        status ===
                        "غير حاضر";


                    return (
                        dateMatch &&
                        statusMatch
                    );

                }
            );


        // ==========================================
        // د ټولګي فلټر
        // ==========================================

        if(
            selectedClass !== "ټول"
        ){

            absentRecords =
                absentRecords.filter(
                    function(record){

                        return String(
                            record.className || ""
                        ).trim() ===
                        selectedClass;

                    }
                );

        }


        // ==========================================
        // Summary
        // ==========================================

        document.getElementById(
            "absentCount"
        ).textContent =
            absentRecords.length;


        document.getElementById(
            "reportDate"
        ).textContent =
            selectedDate;


        document.getElementById(
            "reportClass"
        ).textContent =
            selectedClass;


        // ==========================================
        // که غیر حاضر څوک نه وي
        // ==========================================

        if(
            absentRecords.length === 0
        ){

            studentReport.innerHTML =

                '<div class="empty">' +

                "✅ په دې نېټه غیر حاضر شاګرد نشته." +

                "<br><br>" +

                "که تا نن حاضري ثبت کړې وي، " +

                "ډاډ ترلاسه کړه چې د غیر حاضر شاګرد حالت " +

                "«غیر حاضر» ثبت شوی وي." +

                "</div>";

        }


        // ==========================================
        // Student Cards
        // ==========================================

        absentRecords.forEach(
            function(record){

                // ----------------------------------
                // Student پیدا کول
                // ----------------------------------

                let student =
                    students.find(
                        function(item){

                            return String(
                                item.id
                            ) ===
                            String(
                                record.studentId
                            );

                        }
                    );


                student =
                    student || {};


                // ----------------------------------
                // معلومات
                // ----------------------------------

                const name =
                    record.name ||
                    student.name ||
                    "-";


                const father =
                    record.father ||
                    student.father ||
                    "-";


                const className =
                    record.className ||
                    student.className ||
                    "-";


                const whatsapp =
                    record.whatsapp ||
                    student.whatsapp ||
                    "";


                const date =
                    record.date ||
                    selectedDate;


                // ----------------------------------
                // Card
                // ----------------------------------

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "student";


                div.innerHTML =

                    "<b>👨‍🎓 " +

                    escapeHtml(
                        name
                    ) +

                    "</b>" +

                    "<br>" +

                    "👨‍👦 پلار: " +

                    escapeHtml(
                        father
                    ) +

                    "<br>" +

                    "🏫 ټولګی: " +

                    escapeHtml(
                        className
                    ) +

                    "<br>" +

                    "📅 نېټه: " +

                    escapeHtml(
                        date
                    ) +

                    "<br>" +

                    '<span class="red">' +

                    "❌ غیر حاضر" +

                    "</span>";


                // ----------------------------------
                // WhatsApp Button
                // ----------------------------------

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "whatsapp";


                button.textContent =
                    "📱 پلار ته WhatsApp پیغام";


                button.onclick =
                    function(){

                        window.sendWhatsApp(
                            name,
                            father,
                            className,
                            date,
                            whatsapp
                        );

                    };


                div.appendChild(
                    button
                );


                studentReport.appendChild(
                    div
                );

            }
        );


        // ==========================================
        // Show Report
        // ==========================================

        loading.style.display =
            "none";


        report.style.display =
            "block";


    }catch(error){

        console.error(
            "REPORT ERROR:",
            error
        );


        loading.innerHTML =

            '<div class="error">' +

            "❌ راپور لوډ نه شو." +

            "<br><br>" +

            escapeHtml(
                error.message
            ) +

            "</div>";

    }

};


// ==================================================
// HTML Escape
// ==================================================

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ==================================================
// Back
// ==================================================

window.goBack = function(){

    window.location.href =
        "dashboard.html";

};


// ==================================================
// Start
// ==================================================

window.addEventListener(
    "DOMContentLoaded",
    function(){

        // نننۍ نېټه

        document.getElementById(
            "date"
        ).value =
            getToday();


        // راپور په اتومات ډول ښکاره کړه

        loadReport();

    }
);

</script>
